##
# Robotic arm edge gateway (E_RA): the industrial PC next to the arm.
# It runs the edge half of iDT_RA:
# - Pause: Shared machine resources
# - PostgreSQL
# - BaSyx Configuration Service
# - BaSyx Submodel Repository hosting SensedProperties
# - Contro Command Endpoint (proxy)
#   - turns each invocation into a command for the arm controller
#   - reports the result
#
# The shell of iDT_RA and its static submodels are on the plant server
#

services:
  robotic-arm-edge-gateway:
    image: registry.k8s.io/pause:3.10
    hostname: robotic-arm-edge-gateway
    networks:
      - shop-floor-network
      - plant-network
    ports:
      - "8092:8092" # Submodel Repository
    restart: unless-stopped

  robotic-arm-edge-gateway-database:
    image: postgres:18
    network_mode: service:robotic-arm-edge-gateway
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx # lab credentials
      POSTGRES_DB: basyx
    volumes:
      - robotic-arm-edge-gateway-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U basyx -d basyx"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  robotic-arm-edge-gateway-basyx-configuration:
    image: eclipsebasyx/basyxconfigurationservice-go:1.1.2
    network_mode: service:robotic-arm-edge-gateway
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      POSTGRES_DBNAME: basyx
    depends_on:
      robotic-arm-edge-gateway-database:
        condition: service_healthy
    restart: "no"

  robotic-arm-edge-gateway-submodel-repository:
    image: eclipsebasyx/submodelrepository-go:1.1.2
    network_mode: service:robotic-arm-edge-gateway
    environment:
      SERVER_PORT: "8092"
      POSTGRES_PASSWORD: basyx
      # Operations may be delegated only to the endpoint on this machine
      SMREPO_DELEGATION_TRUSTED_HOSTS: localhost:8080,127.0.0.1:8080
    volumes:
      - ./submodel-repository.yaml:/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:8092/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    depends_on:
      robotic-arm-edge-gateway-basyx-configuration:
        condition: service_completed_successfully
    restart: unless-stopped

  control-commands-endpoint:
    build: ./control-commands-endpoint
    network_mode: service:robotic-arm-edge-gateway
    environment:
      ICG_URL: mqtt://industrial-communication-gateway:1883
      LISTEN_ADDRESS: 127.0.0.1:8080
      REPOSITORY_URL: http://robotic-arm-edge-gateway:8092 #@SEE The descriptor
      PLANT_REGISTRY_URL: http://plant-server:8081
      ASSET_ID: https://plant.example/assets/robotic-arm/RA-0001
      SUBMODEL_FILE: /usr/share/aas/control-commands-endpoint/control-commands-submodel.json
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-20s}
    volumes:
      - ./asset-administration-shells/control-commands-submodel.json:/usr/share/aas/control-commands-endpoint/control-commands-submodel.json:ro
    depends_on:
      robotic-arm-edge-gateway-submodel-repository:
        condition: service_healthy
    restart: unless-stopped

volumes:
  robotic-arm-edge-gateway-database:

networks:
  shop-floor-network:
    internal: true
  plant-network: {}
