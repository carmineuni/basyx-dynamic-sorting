##
# Plat Server
# - Pause: Shared machine resources
# - PostgreSQL
# - BaSyx Configuration Service
# - BaSyx AAS Environment: Go 1.1.2
#   - aas-environment.yaml
#
##
# BaSyx Go Components
#
# https://github.com/eclipse-basyx
# https://github.com/eclipse-basyx/basyx-go-components
# https://github.com/eclipse-basyx/basyx-java-server-sdk:
# | For up-to-date, ready-to-run server components, use BaSyx Go on Docker Hub.
# | See why BaSyx Go? for a comparison with BaSyx Java.
# | https://go.basyx.org/#why
#
# DB-backed microservices:
# - AAS registry
# - AAS repository
# - Submodel registry
# - Submodel repository
# - AAS Environment
# - Discovery
# - Digital Twin Registry
#   - https://wiki.basyx.org/en/latest/content/user_documentation/basyx_components/go/digital_twin_registry/index.html?utm_source=chatgpt.com
#   - https://github.com/eclipse-basyx/basyx-go-components/tree/v1.1.2/examples/BaSyxDigitalTwinRegistryExample
# - AASX file server
# - Concept Description Repository
# - Company Lookup
# - DPP API
#

services:
  plant-server:
    image: registry.k8s.io/pause:3.10
    hostname: plant-server
    ports:
      - "8081:8081" # AAS Environment
    networks:
      - plant-network
    restart: unless-stopped

  plant-server-database:
    image: postgres:18
    network_mode: service:plant-server
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx # lab credentials
      POSTGRES_DB: basyx
    volumes:
      - plant-server-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U basyx -d basyx"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  plant-server-basyx-configuration:
    image: eclipsebasyx/basyxconfigurationservice-go:1.1.2
    network_mode: service:plant-server
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: basyx
      POSTGRES_PASSWORD: basyx
      POSTGRES_DBNAME: basyx
    depends_on:
      plant-server-database:
        condition: service_healthy
    restart: "no"

  plant-server-aas-environment:
    image: eclipsebasyx/aasenvironment-go:1.1.2
    network_mode: service:plant-server
    environment:
      SERVER_PORT: "8081"
      POSTGRES_PASSWORD: basyx
    volumes:
      - ./aas-environment.yaml:/config/config.yaml:ro
      - ./asset-administration-shells:/asset-administration-shells:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:8081/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    depends_on:
      plant-server-basyx-configuration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  plant-server-database:

networks:
  plant-network: {}
