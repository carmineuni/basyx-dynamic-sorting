##
# Industrial communication gateway (ICG)
#
# The message broker of the shop floor. The belt PLC and the arm controller
# publish their states and receive commands here.

services:
  industrial-communication-gateway:
    image: eclipse-mosquitto:2.0.22
    hostname: industrial-communication-gateway
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks:
      - shop-floor-network
    restart: unless-stopped

networks:
  shop-floor-network:
    internal: true
